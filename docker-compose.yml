# Clinic Workforce MVP — 生產 compose(單一真相,2026-07-17 收斂)
services:
  db:
    image: postgres:16
    container_name: clinic-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinic_prod
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - clinic_prod_dbdata:/var/lib/postgresql/data
    networks: [clinic_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024m
        reservations:
          memory: 256m

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinic-prod-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=1024
      DATABASE_URL: postgresql://clinic:${DB_PASSWORD}@db:5432/clinic_prod?connection_limit=15&pool_timeout=20
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${JWT_SECRET}
      FACE_SERVICE_URL: http://face:8000
      FACE_THRESHOLD: ${FACE_THRESHOLD}
      FACE_MODE: shadow
      APRICOT_ENC_KEY: ${APRICOT_ENC_KEY}
      APRICOT_CRON_KEY: ${APRICOT_CRON_KEY}
      EXTERNAL_DUTY_API_KEY: ${EXTERNAL_DUTY_API_KEY}
      EXTERNAL_API_ALLOWED_IPS: ${EXTERNAL_API_ALLOWED_IPS}
    networks: [clinic_net]
    deploy:
      resources:
        limits:
          memory: 1536m
        reservations:
          memory: 512m

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: clinic-prod-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [app]
    networks: [clinic_net]
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m

  face:
    build: ./face-service
    restart: unless-stopped
    networks: [clinic_net]
    volumes:
      - face_models:/root/.insightface
      - face_frames:/data/frames
      - ./face-service/models:/srv/models
    deploy:
      resources:
        limits:
          memory: 2560m
        reservations:
          memory: 512m

networks:
  clinic_net:
    external: true
    name: clinic_clinic_net

volumes:
  clinic_prod_dbdata:
    external: true
    name: clinic_clinic_prod_dbdata
  face_models:
  face_frames:
