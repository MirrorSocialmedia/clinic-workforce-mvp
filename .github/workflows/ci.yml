            src/lib/my-nav.test.ts \
            src/lib/payout-xlsx-engine-parity.test.ts \
            src/lib/payout/daily-report.test.ts \
            src/lib/roster-hours.resign.test.ts \
            src/lib/patient-search.test.ts \
            src/lib/apricot/source-pure.test.ts \
            src/lib/cheque-sheet/build.test.ts \
            src/lib/cheque-sheet/exclude-hint.test.ts \
            src/lib/cheque-print/missing-payouts.test.ts \
            src/lib/cheque-print/records-build.test.ts \
            src/lib/provider-label.test.ts \
