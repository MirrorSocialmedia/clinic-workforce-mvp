            src/lib/clinical/llm-envelope.test.ts \
            src/lib/clinical/quote-parser.test.ts \
            src/lib/clinical/t623-llm-proxy-contract.test.ts \
            src/lib/cost-entry/clinic-prefix.test.ts \
            src/lib/employment-scope.test.ts \
