name: ci

on: [push, pull_request]

# cwi-final S6-1（audit3 P1-22）— CWM（workforce repo）CI
# spec 模板為 W 版（wa-clinic-inbox .github/workflows/ci.yml）；CWM 版按本 repo 實際調整：
#   - pnpm 項目喺 apps/web（root package.json 係 stub）→ install/migrate/tsc/test 全部 working-directory: apps/web
#   - 無 redis service（全 repo git grep REDIS_URL = 0 命中，2026-09-26 核實）
#   - 無 db:seed：deterministic subset 全 mock／self-contained（t623 自管數據行 + 零殘留 assert），
#     唔需要 seed；seed.ts 係 destructive wipe+reseed，唔適合 CI
#   - 測試 scope = deterministic subset（排除清單見 tests step 註釋）
jobs:
  # cwm-labdoc P1 第一步（施工單 §17）：node:22-alpine 試裝 sharp / pdfjs-dist / @napi-rs/canvas
  # 並渲染 test/fixtures/labdoc/*.pdf 做證明。
  # 本機 dev 冇 docker 權 → 呢個 job 用 GH runner 跑真 node:22-alpine（container job）。
  # 版本跟 apps/web/package.json 行鎖（CI 讀呢三行，唔會跟 lockfile 漂移）。
  # 獨立目錄（$RUNNER_TEMP）安裝：唔碰 app 嘅 pnpm-lock.yaml／node_modules，
  # 只裝三個 render 依賴（唔裝全 app 樹）。本 job 只證明渲染路徑（唔跑 tsc/test）。
  # ⚠️ 呢個 job 紅 = alpine 裝唔到/渲染唔到 → Dockerfile 改 node:22-slim 並喺 PR 寫明（施工單 §17 P1）。
  # （gen2 fix 2026-10-05：舊版 ro mount app package.json + npm init → EROFS，
  #   而 npm install <pkgs> 會連全 app 樹一齊裝 → 改獨立目錄 + 精確版本安裝）
  labdoc-alpine-render:
    runs-on: ubuntu-latest
    container: node:22-alpine
    steps:
      - uses: actions/checkout@v4

      - name: Install render deps in isolated dir (musl prebuilt, versions = apps/web/package.json)
        run: |
          set -eu
          PKG="$GITHUB_WORKSPACE/apps/web/package.json"
          VER_SHARP=$(node -p "require('$PKG').dependencies.sharp")
          VER_PDFJS=$(node -p "require('$PKG').dependencies['pdfjs-dist']")
          VER_CANVAS=$(node -p "require('$PKG').dependencies['@napi-rs/canvas']")
          echo "alpine install: sharp@${VER_SHARP} pdfjs-dist@${VER_PDFJS} @napi-rs/canvas@${VER_CANVAS}"
          mkdir -p "$RUNNER_TEMP/render-check"
          cd "$RUNNER_TEMP/render-check"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --loglevel=error \
            "sharp@${VER_SHARP}" "pdfjs-dist@${VER_PDFJS}" "@napi-rs/canvas@${VER_CANVAS}"

      - name: Render labdoc fixtures in node:22-alpine (assert PASS + non-blank pages)
        run: |
          set -eu
          cd "$RUNNER_TEMP/render-check"
          cp "$GITHUB_WORKSPACE/apps/web/scripts/labdoc-render-check.mjs" .
          node labdoc-render-check.mjs "$GITHUB_WORKSPACE/apps/web/test/fixtures/labdoc"
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: clinic_workforce
        ports:
          - "15532:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:pw@localhost:15532/clinic_workforce
      # t623（llm-proxy contract）用明確 test URL — 規避 Prisma .env auto-load 陷阱
      # （apps/web/.env 嘅舊 5432 URL 會喺 import 階段污染）
      CWM_TEST_DATABASE_URL: postgresql://postgres:pw@localhost:15532/clinic_workforce
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4 # = apps/web/package.json packageManager 欄（pnpm@9.15.4）

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install (apps/web)
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Prisma migrate deploy + generate
        working-directory: apps/web
        run: npx prisma migrate deploy && npx prisma generate

      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      # ★ cwm-attfix-20260927 A.3：rules-of-hooks —— 防 hooks 放喺 early return 之後（P0 死機回歸）
      - name: Lint — rules of hooks
        working-directory: apps/web
        run: pnpm run lint:hooks

      # ★ cwm-deployguard-20260928：部署守門入 CI —— 同 deploy.sh 共用 scripts/run-guards.sh 清單，防再漂移
      #   repo 根目錄跑（唔好加 working-directory: apps/web）；check-holiday-coverage 喺 CI 連唔到 clinic_prod 會自動跳過
      - name: Deploy guards（同 deploy.sh 同一份清單）
        run: bash scripts/run-guards.sh

      - name: Tests — deterministic subset
        working-directory: apps/web
        run: |
          # Scope = contract tests（src/app/api/external/** 全收）+ 非環境依賴 src/lib tests。
          # 排除（環境依賴 — 2026-09-26 本地基線：全量 691 tests / 33 fail，fail 全部落在呢 6 個檔；
          #   CI fresh DB 唔會 deterministic，故排除）：
          #   src/lib/apricot/backfill-appointments.test.ts            — 依賴 dev DB(15532) 數據狀態（assertion 差異）
          #   src/lib/apricot/sync-availability-cache.test.ts          — 同上（prisma invocation + 數據 assertion）
          #   src/lib/apricot/sync-availability-cache.single-day.test.ts — 同上
          #   src/lib/apricot/sync-availability-window.test.ts         — 同上（dev DB 都 fail 3 項 — 數據狀態依賴）
          #   src/lib/payroll-run-snapshot-route.test.ts               — 6 項 deterministic fail（400!==200，fake prisma vs route 口徑；base b3ac6338 已存在）
          #   src/lib/payroll-snapshot-asof-write.test.ts              — 要 dev server（next dev -p 3000）+ dev DB 乾淨基線
          # 另：prisma/test-seed.mjs 硬編 5432（唔喺 test glob，CI 唔會跑 — 記此備忘）。
          # t623（S2-9 llm-proxy contract）經 CWM_TEST_DATABASE_URL 跑真 DB，自管數據行（零殘留 assert）。
          # ⚠️ 新增 src/lib test 檔要手動補呢個 list。
          TZ=UTC npx tsx --test \
            'src/app/api/external/**/*.test.ts' \
            src/lib/apricot/account.test.ts \
            src/lib/apricot/availability.test.ts \
            src/lib/apricot/normalize.test.ts \
            src/lib/apricot/s5-active-statuses.test.ts \
            src/lib/apricot/sanitize-availability.v2.test.ts \
            src/lib/apricot/sync-clinicid.test.ts \
            src/lib/apricot/sync-force.test.ts \
            src/lib/apricot/write-booking-paths-guard.test.ts \
            src/lib/apricot/write-booking.test.ts \
            src/lib/base-pay-breakdown.test.ts \
            src/lib/bookable-slots-s5-4.test.ts \
            src/lib/bookable-slots.test.ts \
            src/lib/clinical-index/extract-note-text.test.ts \
            src/lib/clinical-index/refresh-bucket.test.ts \
            src/lib/clinical-index/t694-apricot-lock.test.ts \
            src/lib/clinical-index/visit-index.test.ts \
